version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - modernize
    - revive
    - unconvert
    - unparam
  exclusions:
    generated: disable
    presets:
      - comments
      - std-error-handling
  settings:
    gocritic:
      disabled-checks:
        - appendAssign
        - builtinShadow
        - deferInLoop
        - hugeParam
        - unnamedResult
        - whyNoLint
      enable-all: true
    revive:
      enable-all-rules: false
      enable-default-rules: true
      max-open-files: 2048
      rules:
        - name: dot-imports
          disabled: true
        - name: package-comments
          disabled: true
        - name: redefines-builtin-id
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      # Enable all options, with some exceptions.
      # For defaults, see https://golangci-lint.run/usage/linters/#staticcheck
      checks:
        - all
        - -QF1008     # Omit embedded fields from selector expression; https://staticcheck.dev/docs/checks/#QF1008
        - -ST1003     # Poorly chosen identifier; https://staticcheck.dev/docs/checks/#ST1003

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: disable

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
